<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisk & Whisper - Voice Cooking Assistant</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>🍳 Whisk & Whisper</h1>
            <p class="subtitle">Your Voice-Controlled Cooking Assistant</p>
        </header>

        <!-- ✅ Status bar -->
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Ready</span>
            </div>
            <div id="voiceSupport"></div>
        </div>

        <div class="main-content">
            <!-- 📖 Recipe Selection -->
            <div class="card">
                <h2>📖 Recipe Selection</h2>
                <select id="recipeSelect">
                    <option value="">Choose a recipe...</option>
                    <option value="pancakes">🥞 Fluffy Pancakes</option>
                    <option value="pasta">🍝 Creamy Pasta Carbonara</option>
                    <option value="cookies">🍪 Chocolate Chip Cookies</option>
                    <option value="tacos">🌮 Beef Tacos</option>
                    <option value="stirfry">🥘 Vegetable Stir Fry</option>
                    <option value="smoothie">🥤 Berry Smoothie Bowl</option>
                    <option value="scrambledeggs">🍳 Perfect Scrambled Eggs</option>
                </select>

                <div id="ingredientsSection" class="hidden">
                    <h2>🛒 Ingredients</h2>
                    <ul class="ingredients-list" id="ingredientsList"></ul>
                </div>
            </div>

            <!-- 👨‍🍳 Cooking Instructions -->
            <div class="card">
                <div id="stepDisplay">
                    <div class="empty-state">
                        <div class="empty-state-icon">👨‍🍳</div>
                        <h3>Select a recipe to get started!</h3>
                        <p>Choose from the dropdown menu and start cooking with voice commands.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🎧 Reactive Glow Indicator -->
    <div id="listeningIndicator"></div>

    <!-- 🎉 Toast Message -->
    <div id="toast" class="toast"></div>

    <!-- Load App Script -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
